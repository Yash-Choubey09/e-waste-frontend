<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Access Portal | E-Cure Earth</title>
    <!-- Modern Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-page-wrapper">
    <!-- Toast Notification Container -->
    <div id="toast-container" class="toast-container"></div>

    <div class="auth-card-luxury">
        <a href="index.html" class="auth-nav-back">
            <i class="fas fa-arrow-left"></i> Return to Main Platform
        </a>

        <div style="text-align: center; margin-bottom: 24px;">
            <div style="display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 12px;">
                <div class="logo-3d-wrapper">
                    <div class="logo-ambient-ring"></div>
                    <img src="logo.png" alt="E-Cure Earth Logo">
                </div>
                <span class="logo-text-title" style="font-family: var(--font-heading); font-size: 1.4rem; font-weight: 700; color: var(--color-ivory);">
                    E-Cure<span style="color: var(--color-gold);">.Earth</span>
                </span>
            </div>
            <p style="font-size: 0.88rem; color: var(--text-secondary);">Enterprise Circular Lifecycle & ESG Console</p>
        </div>

        <div class="auth-tabs-toggle">
            <button class="auth-tab-btn active" id="btn-tab-signin">Sign In</button>
            <button class="auth-tab-btn" id="btn-tab-signup">Register Org</button>
        </div>

        <!-- SIGN IN FORM -->
        <form id="standalone-login-form">
            <div class="glass-input-group">
                <label for="auth-email">Corporate Work Email</label>
                <div class="glass-input-wrap">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="auth-email" placeholder="sustainability@company.com" required>
                </div>
            </div>

            <div class="glass-input-group">
                <label for="auth-password">Security Password</label>
                <div class="glass-input-wrap">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="auth-password" placeholder="••••••••••••" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 13px; margin-top: 8px;">
                <i class="fas fa-arrow-right-to-bracket"></i> Authenticate & Enter Console
            </button>
        </form>

        <!-- SIGN UP FORM -->
        <form id="standalone-signup-form" style="display: none;">
            <div class="glass-input-group">
                <label for="signup-org">Organization / Fleet Name</label>
                <div class="glass-input-wrap">
                    <i class="fas fa-building"></i>
                    <input type="text" id="signup-org" placeholder="e.g. Apex Global Technologies" required>
                </div>
            </div>

            <div class="glass-input-group">
                <label for="signup-email">Administrator Email</label>
                <div class="glass-input-wrap">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="signup-email" placeholder="admin@apex.com" required>
                </div>
            </div>

            <div class="glass-input-group">
                <label for="signup-password">Create Password</label>
                <div class="glass-input-wrap">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="signup-password" placeholder="••••••••••••" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 13px; margin-top: 8px;">
                <i class="fas fa-bolt"></i> Initialize Corporate Node
            </button>
        </form>

        <!-- 1-CLICK DEMO LOGIN BOX -->
        <div class="demo-box-card">
            <div style="font-size: 0.78rem; font-weight: 700; text-transform: uppercase; color: var(--color-gold); margin-bottom: 8px;">
                <i class="fas fa-sparkles"></i> 1-Click Demo Profile
            </div>
            <p style="font-size: 0.82rem; color: var(--text-secondary); margin-bottom: 12px;">
                Evaluating the platform? Use the pre-authenticated executive test credentials:
            </p>
            <button id="auth-quick-demo-btn" class="btn btn-forest" style="width: 100%; justify-content: space-between; padding: 10px 16px; font-size: 0.85rem;">
                <span><i class="fas fa-shield-halved" style="color: var(--color-gold);"></i> <strong>Acme Global Tech</strong> (demo@ecure.earth)</span>
                <span style="color: var(--color-gold); font-size: 0.78rem;">Instant Sign In &rarr;</span>
            </button>
        </div>
    </div>

    <script>
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.innerHTML = `<i class="fas fa-circle-check"></i> <span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3500);
        }

        const tabSignIn = document.getElementById('btn-tab-signin');
        const tabSignUp = document.getElementById('btn-tab-signup');
        const formSignIn = document.getElementById('standalone-login-form');
        const formSignUp = document.getElementById('standalone-signup-form');
        const quickDemoBtn = document.getElementById('auth-quick-demo-btn');

        tabSignIn.addEventListener('click', () => {
            tabSignIn.classList.add('active');
            tabSignUp.classList.remove('active');
            formSignIn.style.display = 'block';
            formSignUp.style.display = 'none';
        });

        tabSignUp.addEventListener('click', () => {
            tabSignUp.classList.add('active');
            tabSignIn.classList.remove('active');
            formSignIn.style.display = 'none';
            formSignUp.style.display = 'block';
        });

        function performLogin(name, email) {
            const userSession = {
                name: name,
                email: email,
                role: 'Sustainability Director',
                loggedIn: true
            };
            localStorage.setItem('userSession', JSON.stringify(userSession));
            showToast(`Authenticated as ${name}! Redirecting to Dashboard...`);
            setTimeout(() => {
                window.location.href = 'dashboard.html';
            }, 800);
        }

        formSignIn.addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('auth-email').value;
            const orgName = email.split('@')[0].toUpperCase() + ' Corp';
            performLogin(orgName, email);
        });

        formSignUp.addEventListener('submit', (e) => {
            e.preventDefault();
            const org = document.getElementById('signup-org').value;
            const email = document.getElementById('signup-email').value;
            performLogin(org, email);
        });

        quickDemoBtn.addEventListener('click', () => {
            document.getElementById('auth-email').value = 'demo@ecure.earth';
            document.getElementById('auth-password').value = 'demo123';
            performLogin('Acme Global Technologies', 'demo@ecure.earth');
        });

        // Check URL parameter ?signup=true
        if (new URLSearchParams(window.location.search).get('signup') === 'true') {
            tabSignUp.click();
        }
    </script>
</body>
</html>
